name: Capture proposal evidence

on:
  push:
    branches:
      - planning/ai-first-implementation
    paths:
      - scripts/capture-proposal-evidence.mjs
      - .github/workflows/proposal-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: planning/ai-first-implementation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local application
        shell: bash
        run: |
          npm run dev -- --hostname localhost > /tmp/kotc-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kotc-next.log
          exit 1

      - name: Capture proposal screenshots
        run: node scripts/capture-proposal-evidence.mjs

      - name: Commit generated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proposal-evidence/*.png
          if git diff --cached --quiet; then
            echo "Proposal screenshots are already current."
          else
            git commit -m "docs: capture proposal-ready POC screenshots"
            git push origin HEAD:planning/ai-first-implementation
          fi
