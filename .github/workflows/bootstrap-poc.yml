name: Bootstrap KOTC POC source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-poc.yml

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: planning/ai-first-implementation
          fetch-depth: 0

      - name: Reconstruct and unpack application source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode | tar -xzf - -C .

      - name: Commit complete proof of concept
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: implement complete KOTC interactive learning POC"
            git push origin HEAD:planning/ai-first-implementation
          fi
