name: Proposal Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      CAPTURE_PROPOSAL_SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture proposal screens
        run: npx playwright test tests/e2e/proposal-screenshots.spec.ts --project=chromium
      - name: Upload proposal evidence
        uses: actions/upload-artifact@v4
        with:
          name: kotc-editorial-v2-proposal-screenshots
          path: artifacts/proposal-screenshots
          if-no-files-found: error
          retention-days: 30
